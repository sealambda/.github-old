# Cases for CurrentState.yml: the words of a plan or a gap are flagged, in any
# case, as whole words, and not in code.
- name: currently-is-flagged
  rule: CurrentState.yml
  input: |
    The server currently runs NixOS.
  contains: "Sealambda.CurrentState"

- name: will-be-is-flagged
  rule: CurrentState.yml
  input: |
    The role will be created later.
  contains: "Sealambda.CurrentState:'will be' describes a plan or a gap."

- name: target-in-its-present-meaning-is-clean
  rule: CurrentState.yml
  input: |
    The target group routes the traffic. Each build target has a name.
    An SCP targets an OU.
  want: ""

- name: todo-in-capitals-is-flagged
  rule: CurrentState.yml
  input: |
    TODO write this section.
  contains: "Sealambda.CurrentState"

- name: phase-2-is-flagged
  rule: CurrentState.yml
  input: |
    Phase 2 adds the guard.
  contains: "Sealambda.CurrentState"

- name: present-tense-text-is-clean
  rule: CurrentState.yml
  input: |
    The server runs NixOS. The role exists in the account.
  want: ""

- name: planned-is-not-listed
  rule: CurrentState.yml
  input: |
    The planned window of the vendor is a fact of the contract.
  want: ""

- name: word-that-contains-a-listed-word-is-clean
  rule: CurrentState.yml
  input: |
    The currentness of the willbe value is clear.
  want: ""

- name: for-now-is-flagged
  rule: CurrentState.yml
  input: |
    The role has all rights for now.
  contains: "Sealambda.CurrentState:'for now' describes"

- name: in-the-future-is-flagged
  rule: CurrentState.yml
  input: |
    The guard changes in the future.
  contains: "Sealambda.CurrentState:'in the future' describes"

- name: fixme-is-flagged
  rule: CurrentState.yml
  input: |
    FIXME check the role.
  contains: "Sealambda.CurrentState:'FIXME' describes"

- name: listed-word-in-code-is-clean
  rule: CurrentState.yml
  input: |
    Run `tofu apply -target=aws_iam_role.this`.
  want: ""
