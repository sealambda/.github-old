# Cases for History.yml: the words of a history are suggested, in any case, as
# whole words, and not in code.
- name: previously-is-suggested
  rule: History.yml
  input: |
    The service previously ran on Heroku.
  contains: "Sealambda.History:'previously' may describe history."

- name: formerly-is-suggested-in-capitals
  rule: History.yml
  input: |
    Formerly the service ran on Heroku.
  contains: "Sealambda.History:'Formerly' may describe history."

- name: no-longer-is-suggested
  rule: History.yml
  input: |
    The service no longer uses Heroku.
  contains: "Sealambda.History:'no longer' may describe history."

- name: used-to-is-suggested
  rule: History.yml
  input: |
    The service used to run on Heroku.
  contains: "Sealambda.History:'used to' may describe history."

- name: superseded-is-suggested
  rule: History.yml
  input: |
    This page is superseded by the new one.
  contains: "Sealambda.History:'superseded' may describe history."

- name: was-renamed-is-suggested
  rule: History.yml
  input: |
    The module was renamed to billing.
  contains: "Sealambda.History:'was renamed' may describe history."

- name: present-tense-text-is-clean
  rule: History.yml
  input: |
    The service runs on Fly. The module is named billing.
  want: ""

- name: word-that-contains-a-listed-word-is-clean
  rule: History.yml
  input: |
    The reused value is unused, and the superseder is a role.
  want: ""

- name: listed-word-in-code-is-clean
  rule: History.yml
  input: |
    Run `previously --used to=1` and read the `no longer` field.
  want: ""
