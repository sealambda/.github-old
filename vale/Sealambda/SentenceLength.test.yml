      fourteen fifteen sixteen seventeen eighteen nineteen twenty twentyone
      twentytwo twentythree twentyfour twentyfive twentysix.
  contains: "Sealambda.SentenceLength:This sentence has more than 25 words. Shorten it or split it."

- name: abbreviation-does-not-split-a-sentence
  rule: SentenceLength.yml
  input: |
    One two three four five six seven eight nine ten, e.g. eleven twelve
    thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty
    twentyone twentytwo twentythree twentyfour.
  contains: "Sealambda.SentenceLength:This sentence has more than 25 words. Shorten it or split it."

- name: code-span-is-not-counted
  rule: SentenceLength.yml
  input: |
    One two three four five six seven eight nine ten eleven twelve thirteen
    fourteen fifteen sixteen seventeen eighteen nineteen twenty `one two three
    four five six seven eight nine ten` twentyone.
