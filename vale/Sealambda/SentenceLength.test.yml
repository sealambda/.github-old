  input: |
    One two three four five six seven eight nine ten eleven twelve. One two
    three four five six seven eight nine ten eleven twelve. One two three four
    five six seven eight nine ten eleven twelve.
  want: ""

- name: long-sentence-in-a-list-item-is-flagged
  rule: SentenceLength.yml
  input: |
