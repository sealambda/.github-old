# Cases for SentenceLength.yml: a sentence of more than 25 words is flagged. The
# count skips code, and a period inside an abbreviation doesn't end a sentence.
# The cases use `contains` because the flake check loads the style under a name
# that has a store hash.
- name: sentence-of-26-words-is-flagged
  rule: SentenceLength.yml
  input: |
    One two three four five six seven eight nine ten eleven twelve thirteen
    fourteen fifteen sixteen seventeen eighteen nineteen twenty twentyone
    twentytwo twentythree twentyfour twentyfive twentysix.
  contains: "Sealambda.SentenceLength:This sentence has more than 25 words. Shorten it or split it."

- name: sentence-of-25-words-is-clean
  rule: SentenceLength.yml
  input: |
    One two three four five six seven eight nine ten eleven twelve thirteen
    fourteen fifteen sixteen seventeen eighteen nineteen twenty twentyone
    twentytwo twentythree twentyfour twentyfive.
  want: ""

- name: long-text-in-short-sentences-is-clean
