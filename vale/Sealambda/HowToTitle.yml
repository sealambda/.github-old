# The title of a how-to page starts with an imperative verb that names the task,
# such as "Adopt the hub" (docs/reference/writing-style.md#how-to-titles).
#
# The rule checks the title of every page, the heading of level 1, because a
# Vale rule can't be limited to a folder: only a section of the `.vale.ini`
# can do that. So the rule flags the openers that no page title needs: a
# question or a label ("How to", "Guide to", "Tutorial") and a gerund that
# names an activity ("Using", "Setting up"). It doesn't check that the first
# word is a verb. The list of gerunds leaves out the words that are also
# nouns, such as "Writing" in "Writing style". A reference or explanation page
# that starts with a listed gerund renames the title or turns the rule off for
# it.
# The match is case-insensitive and anchored at the start of the title. Every
# alternative is a fixed string, so the matcher can't backtrack without limit.
# Level: warning. Tests: HowToTitle.test.yml.
extends: existence
message: "Start the title with an imperative verb, not '%s'."
link: https://github.com/sealambda/.github/blob/main/docs/reference/writing-style.md#how-to-titles
level: warning
scope: heading.h1
ignorecase: true
nonword: true
tokens:
  - '^(?:how (?:to|do|does|can|should)|guide to|introduction to|tutorial)\b'
  - '^(?:adding|configuring|creating|deploying|installing|migrating|running|setting up|using)\b'
