name: Secrets

# Reusable workflow. It scans the whole git history for secrets with the
# gitleaks CLI.
#
# Caller contract:
# - Grant `contents: read`.
# - Expose gitleaks in the default dev shell of the flake, for example
#   `inputsFrom = [ hub.devShells.<system>.base ]`. The caller's `flake.lock`
#   pins the tool version.
# - Optionally pass `timeout-minutes`, a whole number of minutes. The job stops
#   when it runs longer. The default is 360 minutes, the limit that GitHub
#   gives a job that sets none. A `uses` job can't set `timeout-minutes`
#   itself, so this input is the only way for a caller to bound the scan. The
#   input accepts any number that a caller passes. The 1 to 360 rule of the
#   `workflows` check covers the workflows of the checked repository only, so
#   it doesn't judge the value of the input.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          JSON for the `runs-on` key, for example "ubuntu-latest" or
          ["ubuntu-24.04-arm"].
        type: string
        default: '"ubuntu-latest"'
      timeout-minutes:
        description: >-
          Minutes after which GitHub cancels the scan. The default is 360, the
          limit that GitHub gives a job that sets none.
        type: number
        default: 360

permissions: {}

jobs:
  # The default of the input is 360 minutes, the limit that GitHub gives a job
  # that sets none, as the section `jobs.<job_id>.timeout-minutes` of the
  # workflow syntax reference says
  # (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax).
  secrets:
    name: gitleaks
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # `install_url` pins the Nix version of `versions.json`. A calling
      # repository runs that version too.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.4/install
      - name: Scan the history
        run: nix develop -c gitleaks git --redact --verbose
