name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# A run never cancels another run. A push that updates a pull request and its
# base branch together can start two runs for one head commit. The group of a
# pull request names the head commit, so the two runs share a group, wait for
# each other, and both finish. A run that a newer run cancelled would leave a
# failed `ci` check on the head commit, because the job `ci` runs in a
# cancelled run and fails there. A new head commit starts a group of its own,
# so the run of the older commit finishes too. A run on `main` never cancels
# another either, because a cancelled run on `main` could leave a merge without
# its release. The group of a push has no head commit. A group holds one
# running and one pending run, and a newer pending run replaces the older one:
# the replaced push gets no release of its own, and the next release covers its
# commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  # The longest of the last 10 runs took 53 seconds. The limit is about 34
  # times that, so a slow cache or a cold build still passes and a hung job
  # fails in half an hour, not in the six hours of GitHub's default.
  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `install_url` pins the Nix version. `versions.json` holds it, and the
      # flake check `versions` fails when the two differ.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.4/install
      - run: nix flake check

  # Builds the checks of the synthetic consumers `nix/tests/consumers/legacy`
  # and `nix/tests/consumers/layered` against this revision of the hub: a
  # change that turns a consumer red turns this job red. The job uses no secret
  # and holds a read-only token, so a pull request from a fork can run it.
  consumer:
    name: synthetic consumer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `install_url` pins the Nix version. `versions.json` holds it, and the
      # flake check `versions` fails when the two differ.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.4/install
      # `--override-input` replaces the hub on GitHub with this checkout, and
      # `--no-write-lock-file` keeps the run from writing a lock file.
      # `--all-systems` evaluates the outputs of every system that the fixture
      # lists, so a function that breaks on another system fails here. Nix
      # builds only the checks of the runner's system.
      - run: >-
          nix flake check --all-systems --no-write-lock-file
          --override-input hub "path:$PWD"
          "path:$PWD/nix/tests/consumers/legacy"
      # The layered consumer holds no copy of the tool configuration, so it
      # has no `sync-config` step.
      - run: >-
          nix flake check --all-systems --no-write-lock-file
          --override-input hub "path:$PWD"
          "path:$PWD/nix/tests/consumers/layered"
      # The `sync-config` app of this checkout writes the synced files into the
      # legacy fixture. A tracked file that changes, or a file that the app adds,
      # means that the copies in the fixture and the app disagree. `git diff`
      # doesn't show an untracked file, so the step reads `git status`. The step
      # overlaps the check `config-in-sync` above: it also runs the app as a
      # consumer does.
      - name: Sync the configuration files and require no change
        working-directory: nix/tests/consumers/legacy
        run: |
          nix run "path:$GITHUB_WORKSPACE#sync-config"
          changes="$(git status --porcelain -- .)"
          if [ -n "$changes" ]; then
            echo "The app changed the fixture:" >&2
            echo "$changes" >&2
            exit 1
          fi

  # Checks every commit of the pull request and the name of its branch with
  # `gitpolicy`. A flake check sees no history and no branch name, so the
  # rules run here and in the Git hooks. The job reads the commits of the head
  # of the pull request, not the merge commit that the checkout holds, because
  # that merge commit is not a commit of the branch. It runs on pull requests
  # only: on `main` the rebase merge has already landed the commits, and the
  # `ci` job accepts that skip. The limit leaves room for a cold Nix cache and
  # fails a hung job in a quarter of an hour.
  git-policy:
    name: git policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # `fetch-depth: 0` fetches the whole history: the range from the base
      # commit to the head commit of the pull request needs both.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # `install_url` pins the Nix version. `versions.json` holds it, and the
      # flake check `versions` fails when the two differ.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.4/install
      - name: Check the commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: nix run .#gitpolicy -- range "$BASE_SHA..$HEAD_SHA"
      # Runs after a failed commit check too, so one run shows both problems.
      # The second `--` ends the options of `gitpolicy`, so a name that starts
      # with `-` reaches the check and fails as a bad name. Without it, the
      # name would be read as an option, and `--help` would pass the job.
      - name: Check the branch name
        if: ${{ !cancelled() }}
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: nix run .#gitpolicy -- branch -- "$HEAD_REF"

  # The hub runs its own reusable workflow, as a consumer does. The `./`
  # form stays because actionlint doesn't yet accept the `$/` form that
  # zizmor suggests. No job lints the workflows or the documentation: the
  # flake check does both. The treefmt module runs actionlint and zizmor, and
  # the `docs` check runs markdownlint-cli2, lychee and Vale. The secrets scan
  # stays a workflow because gitleaks needs the Git history, and the flake
  # check sees none. The scan of the hub took about 24 seconds in the last 10
  # runs. A limit of 10 minutes is about 25 times that, so a slower runner
  # still passes and a hung scan fails soon. A job that calls a reusable
  # workflow can't set `timeout-minutes`, so the call passes the input.
  secrets:
    uses: ./.github/workflows/secrets.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
    with:
      timeout-minutes: 10

  # The one required status check. It fails unless every job it needs
  # succeeded, so a skipped or cancelled job can't pass by omission. One skip
  # is by design: `git-policy` runs on pull requests only, so on a push it
  # may be skipped, and on a pull request it must succeed. The job runs one
  # `jq` command and took 4 seconds in each of the last 10 runs, so 5 minutes
  # is more than 70 times that.
  ci:
    name: ci
    if: always()
    needs: [flake-check, consumer, git-policy, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every needed job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$NEEDS" | jq -e --arg event "$EVENT" '
            to_entries | all(.[];
              .value.result == "success"
              or (.key == "git-policy" and $event == "push"
                  and .value.result == "skipped"))'

  # A release covers every merge to `main`: the merge gets a tag and a release
  # at its commit, or a later release covers it when a newer pending run
  # replaced this run, and then it gets no tag of its own. The job is not part
  # of the `ci` aggregate: it runs after `ci` succeeds, and a failed release
  # does not fail the checks of the merge. `if` has no status function, so
  # GitHub adds `success()` and the job is skipped when `ci` fails. `publish`
  # creates the tag and the release with one `gh` call at the pushed commit.
  # GitHub does not document what a failed call leaves behind, so a re-run
  # checks first: it creates nothing for a commit that a later release covers
  # or whose release exists, and it adds the release to a tag that has none. A
  # re-run is safe. This job holds the only write permission of the workflow.
  release:
    name: release
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # `gh release create` creates the tag and the release
    steps:
      # `fetch-depth: 0` fetches the whole history and every tag: the release
      # needs the previous tag and the commits since it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # `install_url` pins the Nix version. `versions.json` holds it, and the
      # flake check `versions` fails when the two differ.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.4/install
      # Nix evaluates the flake and builds the command in this step, which has
      # no token: only the second step holds the token, and it runs the built
      # command and no Nix.
      - name: Build the release command
        run: nix build .#release --out-link "$RUNNER_TEMP/release"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          "$RUNNER_TEMP/release/bin/release" publish --commit "$GITHUB_SHA"
