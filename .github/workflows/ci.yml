name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# A run of a pull request never cancels another run. A push that updates a pull
# request and its base branch together can start two runs for one head commit.
# The group names the head commit, so the two runs share a group, wait for each
# other, and both finish. A run that a newer run cancelled would leave a failed
# `ci` check on the head commit, because the job `ci` runs in a cancelled run
# and fails there. A new head commit starts a group of its own, so the run of
# the older commit finishes too. The group of a push has no head commit: it
# holds one group for the branch, and a newer push cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

jobs:
  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `install_url` pins the Nix version. `versions.json` holds it, and the
      # flake check `versions` fails when the two differ.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.4/install
      - run: nix flake check

  # The hub runs its own reusable workflow, as a consumer does. The `./`
  # form stays because actionlint doesn't yet accept the `$/` form that
  # zizmor suggests. No job lints the workflows or the documentation: the
  # flake check does both. The treefmt module runs actionlint and zizmor, and
  # the `docs` check runs markdownlint-cli2, lychee and Vale. The secrets scan
  # stays a workflow because gitleaks needs the Git history, and the flake
  # check sees none.
  secrets:
    uses: ./.github/workflows/secrets.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  # The one required status check. It fails unless every job it needs
  # succeeded, so a skipped or cancelled job can't pass by omission.
  ci:
    name: ci
    if: always()
    needs: [flake-check, secrets]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every needed job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e 'all(.[]; .result == "success")'
