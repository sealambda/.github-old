# Prose lint settings of every Sealambda repository.
# https://docs.vale.sh/topics/.vale.ini
# The styles in BasedOnStyles come from Nix, and `flake.lock` pins their
# versions. The hub's `vale.withStyles` package sets VALE_STYLES_PATH, and Vale
# finds the styles there. Don't run `vale sync`, and don't run Vale with
# `--no-global`: that flag makes Vale ignore VALE_STYLES_PATH, so it reports
# "Style isn't on StylesPath". The Vale wrapper in the hub's `nix/lib/docs.nix`
# must provide each style that BasedOnStyles names, except the built-in `Vale`.
# Microsoft and Readability come from nixpkgs. Sealambda is the hub's own style
# (`vale/Sealambda` in the hub): its rules keep a page in the present tense.
# The rule Sealambda.CurrentState has the level error, and Sealambda.History has
# the level suggestion, which the docs check doesn't report.
# StylesPath holds only the vocabularies in StylesPath/config/vocabularies.
# The hub syncs the vocabulary Sealambda, the terms of the organization. A
# repository that keeps this file as a copy keeps its own terms in
# Repository/accept.txt and must create that file, even if empty: Vale stops
# with an error when a listed vocabulary is missing. The Vale wrapper uses this
# file as its base with `Vocab = Sealambda` alone, so a repository that keeps
# no copy needs no such file.
StylesPath = .vale/styles
Vocab = Sealambda, Repository

[*.md]
BasedOnStyles = Vale, Microsoft, Readability, Sealambda
# These two rules check how-to pages, so they are off here and on in the last
# section of this file.
Sealambda.HowToTitle = NO
Sealambda.StepLength = NO

# A decision record states what a decision will change, and a spec describes
# work that isn't built yet, so the words of a plan belong to both. A pattern
# lists "docs" and "**/docs", because Vale matches a section against the path
# as the caller wrote it, and an editor passes an absolute path.
[{docs,**/docs}/{decisions,specs}/**/*.md]
Sealambda.CurrentState = NO

# The title of a how-to page starts with a verb, and its steps are short. Only
# a how-to page has that form, so the two rules that check it are on here.
[{docs,**/docs}/how-to/**/*.md]
Sealambda.HowToTitle = YES
Sealambda.StepLength = YES
